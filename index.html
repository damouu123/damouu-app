<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: το app απλώνεται κάτω από το "notch" του iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Discipline</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a1612">

  <!-- Ειδικά για iOS: το Safari δεν διαβάζει όλα αυτά από το manifest -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Discipline">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="page-title"></h1>
    <span id="offline-badge" class="badge" hidden>Offline</span>
  </header>

  <!-- Εδώ ο router "ζωγραφίζει" την τρέχουσα οθόνη -->
  <main id="view"></main>

  <!-- Η κάτω μπάρα γεμίζει αυτόματα από το registry -->
  <nav id="tabbar" class="tabbar"></nav>

  <!-- Μήνυμα όταν υπάρχει νέα έκδοση του app -->
  <div id="update-banner" class="update-banner" hidden>
    <span>A new version is ready</span>
    <button id="update-btn" class="btn btn-small">Reload</button>
  </div>

  <script type="module">
    import { startRouter } from './js/core/router.js';
    import { requestPersistentStorage } from './js/core/storage.js';

    // Κάθε module καταχωρεί τον εαυτό του στο registry όταν φορτωθεί.
    // Για νέο module (π.χ. workout) αρκεί μία γραμμή import εδώ.
    import './js/modules/calendar.js';
    import './js/modules/xp.js';
    import './js/modules/resume.js';
    import './js/modules/timer.js';
    import './js/modules/wallet.js';
    import './js/modules/notifications.js';
    import './js/modules/backup.js';

    startRouter();
    requestPersistentStorage();

    // --- Ένδειξη offline ---
    const badge = document.getElementById('offline-badge');
    const syncOnline = () => { badge.hidden = navigator.onLine; };
    addEventListener('online', syncOnline);
    addEventListener('offline', syncOnline);
    syncOnline();

    // --- Service worker (offline λειτουργία) ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        const banner = document.getElementById('update-banner');
        const showUpdate = (worker) => {
          banner.hidden = false;
          document.getElementById('update-btn').onclick = () => {
            worker.postMessage('SKIP_WAITING');
          };
        };
        // Νέα έκδοση ήδη κατεβασμένη και περιμένει
        if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
        // Νέα έκδοση κατεβαίνει τώρα
        reg.addEventListener('updatefound', () => {
          const worker = reg.installing;
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdate(worker);
            }
          });
        });
      });

      // Όταν ενεργοποιηθεί η νέα έκδοση, ξαναφορτώνουμε μία φορά
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloaded) return;
        reloaded = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
