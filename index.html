<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: το app απλώνεται κάτω από το "notch" του iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Discipline</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#E9F1FB">

  <!-- Ειδικά για iOS: το Safari δεν διαβάζει όλα αυτά από το manifest -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Discipline">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-main">
      <button id="back-link" class="back-link" type="button" hidden>‹ Back</button>
      <h1 id="page-title"></h1>
    </div>
    <span id="offline-badge" class="badge" hidden>Offline</span>
    <!-- Γρανάζι: φαίνεται μόνο στην Αρχική και πάει στις Ρυθμίσεις -->
    <a id="settings-link" class="icon-btn" href="#/settings" aria-label="Settings" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
  </header>

  <!-- Εδώ ο router "ζωγραφίζει" την τρέχουσα οθόνη -->
  <main id="view"></main>

  <!-- Η κάτω μπάρα γεμίζει αυτόματα από το registry -->
  <nav id="tabbar" class="tabbar"></nav>

  <!-- Μήνυμα όταν υπάρχει νέα έκδοση του app -->
  <div id="update-banner" class="update-banner" hidden>
    <span>A new version is ready</span>
    <button id="update-btn" class="btn btn-small">Reload</button>
  </div>

  <script type="module">
    import { startRouter } from './js/core/router.js';
    import { requestPersistentStorage } from './js/core/storage.js';
    import { initUpdates } from './js/core/updates.js';

    // Κάθε module καταχωρεί τον εαυτό του στο registry όταν φορτωθεί.
    // Για νέο module (π.χ. workout) αρκεί μία γραμμή import εδώ.
    import './js/modules/calendar.js';
    import './js/modules/dayview.js';
    import './js/modules/xp.js';
    import './js/modules/resume.js';
    import './js/modules/timer.js';
    import './js/modules/notifications.js';
    import './js/modules/push.js';
    import './js/modules/backup.js';

    startRouter();
    requestPersistentStorage();

    // --- Ένδειξη offline ---
    const badge = document.getElementById('offline-badge');
    const syncOnline = () => { badge.hidden = navigator.onLine; };
    addEventListener('online', syncOnline);
    addEventListener('offline', syncOnline);
    syncOnline();

    // --- Service worker: offline λειτουργία και ενημερώσεις (js/core/updates.js) ---
    initUpdates();
  </script>
</body>
</html>
