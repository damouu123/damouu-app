# Ρυθμίσεις για το Cloudflare (εντολή: npx wrangler deploy, μέσα στον φάκελο server)
name = "discipline-push"
main = "worker.js"
compatibility_date = "2026-09-01"

# Κάθε λεπτό: έλεγχος αν πρέπει να σταλεί ειδοποίηση
[triggers]
crons = ["* * * * *"]

# Η "βάση" του server (KV). Το id μπαίνει μετά την εντολή:
#   npx wrangler kv namespace create DB
[[kv_namespaces]]
binding = "DB"
id = "ce7dc37c33ae4cf7bed9d93e48b22cbc"
